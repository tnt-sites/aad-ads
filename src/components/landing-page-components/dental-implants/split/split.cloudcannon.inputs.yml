backgroundColor:
  type: select
  comment: Background color of the split section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
heading:
  type: text
  comment: Section heading (h2). Supports <br> for line breaks.

headingFontFamily:
  type: select
  comment: Heading font. Leave blank for the headings font. "Accent" is the decorative font set by the page theme.
  options:
    allow_empty: true
    values: _select_data.fontRoles

paragraphs:
  type: array
  comment: Body text paragraphs. Each item is one paragraph and supports basic inline HTML.
  options:
    structures:
      values:
        - label: Paragraph
          icon: notes
          value: ""
          _inputs:
            value:
              type: textarea

image:
  type: object
  comment: Photo displayed in the split column.
  options:
    structures:
      values:
        - label: Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea

figcaption:
  type: text
  comment: Optional caption overlaid at the bottom of the image.

buttonSections:
  type: array
  comment: Optional CTA button(s) below the text.
  options:
    structures: _structures.buttonSections

reverse:
  type: checkbox
  comment: When checked, the image appears on the left and content on the right.

imageNoShadow:
  type: checkbox
  comment: When checked, removes the drop shadow from the image.

headingColor:
  type: select
  comment: Color of the section h2 heading.
  options:
    values:
      - id: "var(--color-heading)"
        name: Default Heading
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#324248"
        name: Dark Teal
      - id: "var(--color-text-inverse)"
        name: White

accentColor:
  type: select
  comment: Accent color used for links or highlighted elements within the section.
  options:
    values:
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
      - id: "var(--color-brand-muted)"
        name: Brand Tertiary
      - id: "#15A1DC"
        name: Implants Blue
