backgroundColor:
  type: select
  comment: Background color of the split section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
heading:
  type: text
  comment: Section heading (h2). Supports <br> for manual line breaks.

listItems:
  type: array
  comment: Bullet list items displayed below the heading. Each item gets a + marker.
  options:
    structures:
      values:
        - label: List Item
          icon: add
          value: ""

groups:
  type: array
  comment: Optional subheaded lists shown after the main list (e.g. one per dentist). Each group has its own h3 and bullet list.
  options:
    structures:
      values:
        - label: List Group
          icon: format_list_bulleted
          value:
            subheading: ""
            listItems: []
          _inputs:
            subheading:
              type: text
              comment: Subheading (h3) above this list, e.g. a doctor's name.
            listItems:
              type: array
              comment: Bullet list items for this group.
              options:
                structures:
                  values:
                    - label: List Item
                      icon: add
                      value: ""

image:
  type: object
  comment: Photo displayed on the opposite side of the content.
  options:
    structures:
      values:
        - label: Section Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional caption displayed below the photo.

reverse:
  type: checkbox
  comment: When enabled, the photo appears on the left and content on the right (desktop). On phones the photo always sits below the text.

buttonSections:
  type: array
  comment: Optional CTA button(s) displayed below the list.
  options:
    structures: _structures.buttonSections

accentColor:
  type: select
  comment: Color of the + bullet markers and the H2 heading.
  options:
    allow_empty: true
    values: _select_data.brandColors

headingColor:
  type: select
  comment: Color of the H2 heading. Overrides accentColor for the heading only.
  options:
    allow_empty: true
    values: _select_data.brandColors

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
