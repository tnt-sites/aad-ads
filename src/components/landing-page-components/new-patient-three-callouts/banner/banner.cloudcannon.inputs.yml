backgroundColor:
  type: select
  comment: Background color of the banner section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds

backgroundGradient:
  type: text
  comment: Optional CSS gradient layered over the background color (e.g. a soft white glow behind the photo). Leave blank for a flat color.

subheading:
  type: text
  comment: Small uppercase text displayed above the main heading (e.g. "Reston's").

heading:
  type: text
  comment: Main H1 heading text. Supports <br> for manual line breaks.

badgeImage:
  type: object
  comment: Optional badge or award image displayed below the heading.
  options:
    structures:
      values:
        - label: Badge Image
          icon: workspace_premium
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the badge image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

badgeMobileOnly:
  type: checkbox
  comment: Show the badge here on phones and tablets only. Turn on when the desktop badge sits on the Three Callouts cards instead.

image:
  type: object
  comment: Full-height photo displayed on the right side of the banner.
  options:
    structures:
      values:
        - label: Banner Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the banner photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

mobileImage:
  type: object
  comment: Optional photo used below 1024px instead of the banner photo (e.g. a tighter crop). Leave blank to use the banner photo everywhere.
  options:
    structures:
      values:
        - label: Mobile Photo
          icon: smartphone
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the mobile photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility. Leave blank to reuse the banner photo's alt text.

figcaption:
  type: text
  comment: Optional caption overlaid on the banner photo (e.g. doctor names). Supports <br> for line breaks.

buttonSections:
  type: array
  comment: Optional CTA buttons displayed below the badge image.
  options:
    structures: _structures.buttonSections

accentColor:
  type: select
  comment: Color of the left bracket decoration on the banner.
  options:
    allow_empty: true
    values: _select_data.brandColors

headingColor:
  type: select
  comment: Color of the main H1 heading.
  options:
    allow_empty: true
    values: _select_data.brandColors

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
